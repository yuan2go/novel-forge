{
  "schema_version": "novel-forge.test-reality-manifest.v1",
  "collections": [
    "tests/architecture",
    "tests/unit",
    "tests/acceptance",
    "tests/integration"
  ],
  "classification_rules": [
    {
      "id": "qualification-infrastructure",
      "patterns": [
        "tests/unit/test_architecture_manifest.py",
        "tests/unit/test_backend_qualification*.py",
        "tests/unit/test_core_os_characterization.py",
        "tests/unit/test_documentation_reality.py",
        "tests/unit/test_historical_reality.py",
        "tests/unit/test_implementation_tree_identity.py",
        "tests/unit/test_integration_database_safety.py",
        "tests/unit/test_instruction_surface.py",
        "tests/unit/test_production_execution_inventory.py",
        "tests/unit/test_production_reachability.py",
        "tests/unit/test_pytest_collection_evidence.py",
        "tests/unit/test_release_run_evidence.py",
        "tests/unit/test_skill_sync.py",
        "tests/unit/test_test_reality.py",
        "tests/unit/test_worker_fleet_evidence.py",
        "tests/architecture/test_architecture_fitness.py",
        "tests/architecture/test_architecture_manifests.py",
        "tests/architecture/test_backend_qualification_boundaries.py",
        "tests/architecture/test_head_integrity.py",
        "tests/architecture/test_release_entrypoint_contract.py"
      ],
      "classification": "QUALIFICATION_INFRASTRUCTURE",
      "owner": "repository-qualification",
      "capability": "canonical-qualification",
      "production_target": "src/novel_forge/tools/backend_qualification.py",
      "qualification_role": "QUALIFICATION_MECHANICS_ONLY",
      "proof_ceiling": "INFRASTRUCTURE_ONLY"
    },
    {
      "id": "retired-runtime-guards",
      "patterns": ["tests/architecture/test_retired_compatibility_runtime.py"],
      "classification": "RETIREMENT_GUARD",
      "owner": "repository-architecture",
      "capability": "retired-runtime-absence",
      "production_target": "architecture/manifests/module-manifest.yaml",
      "qualification_role": "NEGATIVE_BOUNDARY_ONLY",
      "proof_ceiling": "RETIREMENT_ONLY"
    },
    {
      "id": "agent-harness-fixture-protocol",
      "patterns": ["tests/unit/test_unified_agent_harness.py"],
      "classification": "FIXTURE_PROTOCOL",
      "owner": "agent-runtime-authority",
      "capability": "agent-harness-protocol",
      "production_target": "src/novel_forge/modules/agent_runtime/harness.py",
      "qualification_role": "FIXTURE_CONTRACT_ONLY",
      "proof_ceiling": "FIXTURE_ONLY"
    },
    {
      "id": "migration-compatibility",
      "patterns": [
        "tests/unit/test_*migration*.py",
        "tests/unit/test_*upgrade*.py",
        "tests/unit/test_postgres_migrations.py",
        "tests/integration/test_*migration*.py",
        "tests/integration/test_*upgrade*.py",
        "tests/integration/test_authority_schema_postgres.py",
        "tests/integration/test_book_opening_legacy_reconciliation_postgres.py",
        "tests/integration/test_book_opening_recovery_regression_postgres.py",
        "tests/integration/test_book_opening_runtime_hardening_postgres.py"
      ],
      "classification": "MIGRATION_COMPATIBILITY",
      "owner": "migration-authority",
      "capability": "fresh-install-and-supported-upgrade",
      "production_target": "src/novel_forge/storage/migrations/runner.py",
      "qualification_role": "COMPATIBILITY_ONLY",
      "proof_ceiling": "MIGRATION_COMPATIBILITY_ONLY"
    },
    {
      "id": "current-authority-boundaries",
      "patterns": ["tests/architecture/test_*.py"],
      "classification": "CURRENT_AUTHORITY_BOUNDARY",
      "owner": "repository-architecture",
      "capability": "current-authority-boundaries",
      "production_target": "architecture/manifests/production-entry-manifest.yaml",
      "qualification_role": "CURRENT_BUSINESS_SUPPORT",
      "proof_ceiling": "STATIC_AUTHORITY_BOUNDARY"
    },
    {
      "id": "current-postgresql-runtime-contracts",
      "patterns": ["tests/integration/test_*.py"],
      "classification": "CURRENT_RUNTIME_CONTRACT",
      "owner": "runtime-authorities",
      "capability": "postgresql-runtime",
      "production_target": "compose.yml",
      "qualification_role": "CURRENT_BUSINESS_SUPPORT",
      "proof_ceiling": "POSTGRESQL_INTEGRATION_ONLY"
    },
    {
      "id": "current-acceptance-contracts",
      "patterns": ["tests/acceptance/test_*.py"],
      "classification": "CURRENT_RUNTIME_CONTRACT",
      "owner": "runtime-authorities",
      "capability": "backend-acceptance",
      "production_target": "src/novel_forge/api/authority_app.py",
      "qualification_role": "CURRENT_BUSINESS_SUPPORT",
      "proof_ceiling": "IN_PROCESS_ACCEPTANCE_ONLY"
    },
    {
      "id": "current-domain-invariants",
      "patterns": ["tests/unit/test_*.py"],
      "classification": "CURRENT_DOMAIN_INVARIANT",
      "owner": "AUTO_FROM_PRODUCTION_TARGET",
      "capability": "current-domain-and-runtime-policy",
      "production_target": "AUTO_FROM_TEST_IMPORTS",
      "qualification_role": "CURRENT_BUSINESS_SUPPORT",
      "proof_ceiling": "IN_PROCESS_CONTRACT_ONLY"
    }
  ],
  "semantic_slice_policy": {
    "migration_matrix": {
      "role": "MIGRATION_COMPATIBILITY",
      "proof_ceiling": "MIGRATION_COMPATIBILITY_ONLY"
    },
    "provider_hard_stop_and_callback": {
      "role": "CURRENT_BUSINESS_CAPABILITY",
      "proof_ceiling": "CURRENT_CONTRACT_NO_REAL_PROVIDER"
    },
    "provider_effect_fixture_control": {
      "role": "CURRENT_BUSINESS_CAPABILITY",
      "proof_ceiling": "FIXTURE_CONTROL_ONLY"
    },
    "story_design_plan_change_activation": {
      "role": "CURRENT_BUSINESS_CAPABILITY",
      "proof_ceiling": "POSTGRESQL_CURRENT_CONTRACT"
    },
    "backend_vertical_slice": {
      "role": "CURRENT_BUSINESS_CAPABILITY",
      "proof_ceiling": "POSTGRESQL_CURRENT_CONTRACT"
    },
    "book_opening_recovery": {
      "role": "CURRENT_BUSINESS_CAPABILITY",
      "proof_ceiling": "POSTGRESQL_CURRENT_CONTRACT"
    }
  }
}
