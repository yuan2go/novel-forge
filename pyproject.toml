[project]
name = "novel-forge"
version = "0.1.0"
description = "NovelForge Universe Factory: file-based industrial novel production system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "yuan2go" }
]
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = []

[tool.novelforge]
workspace_dir = "04_novel_projects"
templates_dir = "templates"
docs_dir = "docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
