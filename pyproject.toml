[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-forge"
version = "5.0.0"
description = "File-based industrial AI novel production system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
novel-forge = "novel_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
