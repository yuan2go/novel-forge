[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-forge"
version = "6.0.0"
description = "Local-first Novel OS runtime for traceable AI novel production"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]
provider-openai = [
    "openai>=1.99.0,<2",
]
test = [
    "fastapi>=0.115",
    "httpx2>=0.1",
    "pytest>=8.0",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "PyYAML>=6.0",
]
worker = [
    "celery[redis]>=5.4",
    "redis>=5.0",
]
vector = [
    "qdrant-client>=1.10",
]
object = [
    "minio>=7.2",
]
graph = [
    "neo4j>=5.20",
]
ingestion = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "ebooklib>=0.18",
]
industrial = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "minio>=7.2",
]
industrial-graph = [
    "neo4j>=5.20",
]

[project.scripts]
novel-forge = "novel_forge.cli:main"
novel-forge-source-authority-worker = "novel_forge.workers.source_authority:cli"
novel-forge-mkaos-authority-worker = "novel_forge.workers.mkaos_authority:cli"
novel-forge-book-authority-worker = "novel_forge.workers.book_authority:cli"
novel-forge-agent-authority-worker = "novel_forge.workers.agent_authority:main"
novel-forge-outbox-worker = "novel_forge.workers.outbox_authority:cli"
novel-forge-authority-worker = "novel_forge.workers.runtime_groups:authority_cli"
novel-forge-execution-worker = "novel_forge.workers.runtime_groups:execution_cli"
novel-forge-integration-worker = "novel_forge.workers.runtime_groups:integration_cli"
novel-forge-maintenance-worker = "novel_forge.workers.runtime_groups:maintenance_cli"
novel-forge-d0-provider-worker = "novel_forge.workers.d0_provider_qualification:cli"

[tool.setuptools.packages.find]
where = ["src"]
