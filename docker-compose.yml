services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novel_forge
      POSTGRES_USER: novel_forge
      POSTGRES_PASSWORD: novel_forge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_forge -d novel_forge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: novel_forge
      MINIO_ROOT_PASSWORD: novel_forge_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: novel_forge
      CLICKHOUSE_USER: novel_forge
      CLICKHOUSE_PASSWORD: novel_forge
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOVEL_FORGE_ROOT: /runtime
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@postgres:5432/novel_forge
      NOVEL_FORGE_REDIS_URL: redis://redis:6379/0
      NOVEL_FORGE_CELERY_BROKER_URL: redis://redis:6379/0
      NOVEL_FORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      NOVEL_FORGE_QDRANT_URL: http://qdrant:6333
      NOVEL_FORGE_MINIO_ENDPOINT: minio:9000
      NOVEL_FORGE_PGVECTOR_ONLINE: ${NOVEL_FORGE_PGVECTOR_ONLINE:-0}
      NOVEL_FORGE_PGVECTOR_STRICT: ${NOVEL_FORGE_PGVECTOR_STRICT:-0}
      NOVEL_FORGE_CLICKHOUSE_ONLINE: ${NOVEL_FORGE_CLICKHOUSE_ONLINE:-0}
      NOVEL_FORGE_CLICKHOUSE_URL: ${NOVEL_FORGE_CLICKHOUSE_URL:-http://clickhouse:8123}
      NOVEL_FORGE_CLICKHOUSE_DATABASE: ${NOVEL_FORGE_CLICKHOUSE_DATABASE:-novel_forge}
      NOVEL_FORGE_CLICKHOUSE_USER: ${NOVEL_FORGE_CLICKHOUSE_USER:-novel_forge}
      NOVEL_FORGE_CLICKHOUSE_PASSWORD: ${NOVEL_FORGE_CLICKHOUSE_PASSWORD:-novel_forge}
      NOVEL_FORGE_API_HOST: 0.0.0.0
      NOVEL_FORGE_API_PORT: 8000
      NOVEL_FORGE_API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: ["python", "-m", "novel_forge.cli", "serve-api", "--root", "/runtime", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./.local/workspace:/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOVEL_FORGE_ROOT: /runtime
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@postgres:5432/novel_forge
      NOVEL_FORGE_REDIS_URL: redis://redis:6379/0
      NOVEL_FORGE_CELERY_BROKER_URL: redis://redis:6379/0
      NOVEL_FORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      NOVEL_FORGE_QDRANT_URL: http://qdrant:6333
      NOVEL_FORGE_MINIO_ENDPOINT: minio:9000
      NOVEL_FORGE_PGVECTOR_ONLINE: ${NOVEL_FORGE_PGVECTOR_ONLINE:-0}
      NOVEL_FORGE_PGVECTOR_STRICT: ${NOVEL_FORGE_PGVECTOR_STRICT:-0}
      NOVEL_FORGE_CLICKHOUSE_ONLINE: ${NOVEL_FORGE_CLICKHOUSE_ONLINE:-0}
      NOVEL_FORGE_CLICKHOUSE_URL: ${NOVEL_FORGE_CLICKHOUSE_URL:-http://clickhouse:8123}
      NOVEL_FORGE_CLICKHOUSE_DATABASE: ${NOVEL_FORGE_CLICKHOUSE_DATABASE:-novel_forge}
      NOVEL_FORGE_CLICKHOUSE_USER: ${NOVEL_FORGE_CLICKHOUSE_USER:-novel_forge}
      NOVEL_FORGE_CLICKHOUSE_PASSWORD: ${NOVEL_FORGE_CLICKHOUSE_PASSWORD:-novel_forge}
    command: ["python", "-m", "novel_forge.cli", "worker", "--root", "/runtime", "--loglevel", "INFO", "--concurrency", "2"]
    volumes:
      - ./.local/workspace:/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NOVEL_FORGE_API_URL: http://localhost:8000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/novel_forge_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  clickhouse-data:
  clickhouse-logs:
  neo4j-data:
