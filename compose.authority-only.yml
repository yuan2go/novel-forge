name: novel-forge-authority-only

x-authority-environment: &authority-environment
  NOVEL_FORGE_ENVIRONMENT: production
  NOVEL_FORGE_STORAGE_AUTHORITY: postgresql
  NOVEL_FORGE_AUTHORITY_RUNTIME_PROFILE: track-b-minimal
  NOVEL_FORGE_LEGACY_WRITE_ENABLED: "false"
  NOVEL_FORGE_SILENT_LEGACY_FALLBACK_ENABLED: "false"
  NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:${NOVEL_FORGE_POSTGRES_PASSWORD:-UNSET_REQUIRED}@postgres:5432/novel_forge
  NOVEL_FORGE_REDIS_URL: redis://redis:6379/0
  NOVEL_FORGE_CELERY_BROKER_URL: redis://redis:6379/0
  NOVEL_FORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
  NOVEL_FORGE_MINIO_ENDPOINT: minio:9000
  NOVEL_FORGE_MINIO_ACCESS_KEY: ${NOVEL_FORGE_MINIO_ACCESS_KEY:-UNSET_REQUIRED}
  NOVEL_FORGE_MINIO_SECRET_KEY: ${NOVEL_FORGE_MINIO_SECRET_KEY:-UNSET_REQUIRED}
  NOVEL_FORGE_APPLICATION_BUILD_ID: ${NOVEL_FORGE_APPLICATION_BUILD_ID:-UNSET_INVALID}
  NOVEL_FORGE_COMMIT_SHA: ${NOVEL_FORGE_COMMIT_SHA:-UNSET_INVALID}
  NOVEL_FORGE_LOCAL_OPERATOR_PRINCIPAL_ID: ${NOVEL_FORGE_LOCAL_OPERATOR_PRINCIPAL_ID:-UNSET_INVALID}
  NOVEL_FORGE_AUTHORITY_PROJECT_SCOPE: ${NOVEL_FORGE_AUTHORITY_PROJECT_SCOPE:-*}

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  environment: *authority-environment
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novel_forge
      POSTGRES_USER: novel_forge
      POSTGRES_PASSWORD: ${NOVEL_FORGE_POSTGRES_PASSWORD:-UNSET_REQUIRED}
    volumes:
      - authority-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_forge -d novel_forge"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - authority-redis-delivery-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    labels:
      novel-forge.role: delivery-only
      novel-forge.authority: "false"

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${NOVEL_FORGE_MINIO_ACCESS_KEY:-UNSET_REQUIRED}
      MINIO_ROOT_PASSWORD: ${NOVEL_FORGE_MINIO_SECRET_KEY:-UNSET_REQUIRED}
    volumes:
      - authority-object-data:/data

  migrate:
    <<: *python-service
    restart: "no"
    command: ["python", "-m", "novel_forge.cli", "authority-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  authority-api:
    <<: *python-service
    command: ["python", "-m", "novel_forge.cli", "serve-api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  authority-worker:
    <<: *python-service
    command: ["novel-forge-authority-worker"]
    environment:
      <<: *authority-environment
      NOVEL_FORGE_RUNTIME_GROUP_WORKER_ID: authority-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  maintenance-worker:
    <<: *python-service
    command: ["novel-forge-maintenance-worker"]
    environment:
      <<: *authority-environment
      NOVEL_FORGE_RUNTIME_GROUP_WORKER_ID: maintenance-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  execution-worker:
    <<: *python-service
    profiles: ["extended-execution"]
    command: ["novel-forge-execution-worker"]
    environment:
      <<: *authority-environment
      NOVEL_FORGE_RUNTIME_GROUP_WORKER_ID: execution-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully

  integration-worker:
    <<: *python-service
    profiles: ["extended-integration"]
    command: ["novel-forge-integration-worker"]
    environment:
      <<: *authority-environment
      NOVEL_FORGE_RUNTIME_GROUP_WORKER_ID: integration-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  authority-postgres-data:
  authority-redis-delivery-data:
  authority-object-data:
