name: Core OS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  backend-qualification:
    name: P0 Backend Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      P0_PROFILE: ci
      P0_EVIDENCE_DIR: /tmp/novel-forge-p0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install backend qualification dependencies
        run: python -m pip install -e ".[test,industrial]"
      - name: Run canonical repository PR gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PR_BASE_SHA" ] || [ "$PR_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            PR_BASE_SHA=$(git rev-parse HEAD^)
          fi
          make pr-governance PR_BASE_SHA="$PR_BASE_SHA"
      - name: Upload exact-SHA backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-backend-qualification-${{ github.sha }}
          path: /tmp/novel-forge-p0/**
          if-no-files-found: error
          retention-days: 30
