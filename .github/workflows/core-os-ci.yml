name: Core OS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  NOVEL_FORGE_POSTGRES_WRITE_STRICT: "true"

# Every proof in this workflow is recomputed from the checked-out revision. A
# repository evidence commit may summarize a run, but it is never its own
# tested SHA.

jobs:
  lint-and-architecture:
    name: lint and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[api,postgres]"
      - name: Immutable revision and compile
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m compileall -q src tests
          git diff --check
      - name: Architecture boundaries
        run: |
          make head-integrity-check
          make authority-parity-check
          make architecture-manifests-check
          make architecture-fitness-check
          make authority-only-config-check
          python -m unittest discover -s tests/architecture -p 'test_*.py'
      - name: Static validation
        run: |
          make lint
          make validate
          make check-skills

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Unit and acceptance collection
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py'
          python -m unittest discover -s tests/acceptance -p 'test_*.py'

  postgres-authority:
    name: postgres authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: novel_forge_core_os_test
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_core_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_core_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Focused Command Kernel and Authority proofs
        run: |
          python -m novel_forge.cli authority-migrate
          python scripts/run_authority_postgres_tests.py
          python -m unittest tests.integration.test_external_effect_runtime_postgres
      - name: Core domain migration proofs
        run: |
          mkdir -p /tmp/novel-forge-evidence
          python -m unittest -v \
            tests.integration.test_authority_legacy_migration_postgres \
            2>&1 | tee "/tmp/novel-forge-evidence/domain-migration-${GITHUB_SHA}.log"
      - name: Per-worker PostgreSQL integration proofs
        run: |
          python -m unittest -v \
            tests.integration.test_chapter_authority_scheduler_postgres \
            tests.integration.test_content_authority_scheduler_recovery_postgres \
            tests.integration.test_source_document_authority_postgres \
            tests.integration.test_mkaos_authority_postgres \
            tests.integration.test_book_authority_postgres \
            tests.integration.test_outbox_authority_worker_postgres \
            tests.integration.test_maintenance_worker_postgres \
            2>&1 | tee "/tmp/novel-forge-evidence/worker-integration-${GITHUB_SHA}.log"
      - name: Complete integration collection
        run: python -m unittest discover -s tests/integration -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-authority-${{ github.sha }}
          path: /tmp/novel-forge-evidence/*-${{ github.sha }}.log
          if-no-files-found: error

  migration:
    name: clean and legacy migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: novel_forge_core_os_migration
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_core_os_migration"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_core_os_migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Clean, upgrade, and domain migration proof
        run: |
          mkdir -p /tmp/novel-forge-evidence
          python -m unittest -v \
            tests.integration.test_authority_migrations_postgres \
            tests.integration.test_authority_schema_postgres \
            tests.integration.test_authority_legacy_migration_postgres \
            2>&1 | tee "/tmp/novel-forge-evidence/migration-${GITHUB_SHA}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: migration-${{ github.sha }}
          path: /tmp/novel-forge-evidence/migration-${{ github.sha }}.log
          if-no-files-found: error

  provider-v2-conformance:
    name: provider v2 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Mock-only provider control proofs
        run: |
          python -m unittest tests.unit.test_provider_adapter_v2
          python -m unittest tests.unit.test_d0_provider_qualification
          python -m unittest tests.unit.test_chapter_authority_dependencies
          python -m unittest tests.unit.test_creative_generator_boundary

  callback-authority:
    name: callback authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: novel_forge_callback_test
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_callback_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_callback_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest tests.integration.test_provider_callback_authority_postgres tests.integration.test_worker_health_postgres

  book-authority:
    name: book authority fixture protocol
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: novel_forge_book_test
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_book_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_book_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest tests.integration.test_book_authority_postgres

  catalog-integrity:
    name: catalog and coverage binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Generate HEAD-bound evidence
        run: |
          python -m novel_forge.tools.authority_coverage_manifest \
            --repo-root . \
            --output /tmp/postgresql-authority-coverage-${GITHUB_SHA}.json \
            --check-head
          python -m unittest tests.architecture.test_authority_coverage_baseline
          python -m unittest tests.unit.test_authority_coverage_manifest
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-authority-coverage-${{ github.sha }}
          path: /tmp/postgresql-authority-coverage-${{ github.sha }}.json
          if-no-files-found: error

  authority-compose:
    name: authority compose fixture and recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test,industrial]"
      - name: Validate Compose contracts
        run: make authority-compose-config-check
      - name: Run isolated Authority Compose proof
        run: |
          mkdir -p /tmp/novel-forge-evidence
          python scripts/verify_authority_compose.py \
            > "/tmp/novel-forge-evidence/authority-compose-${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: authority-compose-${{ github.sha }}
          path: /tmp/novel-forge-evidence/authority-compose-${{ github.sha }}.json
          if-no-files-found: error

  query-plan-release:
    name: representative query plan release qualification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: novel_forge_query_release
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_query_release"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_query_release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: python -m pip install -e ".[test]"
      - name: Migrate and qualify real Planner choice
        run: |
          mkdir -p /tmp/novel-forge-evidence
          python -m novel_forge.cli authority-migrate
          python scripts/qualify_authority_query_plans.py \
            --output "/tmp/novel-forge-evidence/query-plan-${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: query-plan-${{ github.sha }}
          path: /tmp/novel-forge-evidence/query-plan-${{ github.sha }}.json
          if-no-files-found: error

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Bind checkout to workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm --prefix web/admin ci
      - run: npm --prefix web/admin test
      - run: npm --prefix web/admin run build

# Real-provider proofs are intentionally absent. They remain credentialed,
# manual, opt-in workflows after functional convergence is accepted.
