name: Core OS CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ github.sha }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: novel_forge_core_os_test
          POSTGRES_USER: novel_forge
          POSTGRES_PASSWORD: novel_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel_forge -d novel_forge_core_os_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src
      NOVEL_FORGE_DATABASE_URL: postgresql://novel_forge:novel_forge@localhost:5432/novel_forge_core_os_test
      NOVEL_FORGE_POSTGRES_WRITE_STRICT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record immutable revision
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain
          echo "core_os_head=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e ".[api,postgres]"
      - name: Generate head-bound authority coverage evidence
        run: |
          python -m novel_forge.tools.authority_coverage_manifest \
            --repo-root . \
            --output /tmp/postgresql-authority-coverage-${GITHUB_SHA}.json \
            --check-head
          python -m unittest tests.architecture.test_authority_coverage_baseline -v
      - name: Upload authority coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-authority-coverage-${{ github.sha }}
          path: /tmp/postgresql-authority-coverage-${{ github.sha }}.json
          if-no-files-found: error
      - name: Python regression
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: PostgreSQL migrations and integration
        run: |
          python -m novel_forge.cli postgres-init --root .local/ci-workspace
          python scripts/run_authority_postgres_tests.py
          python -m unittest discover -s tests/integration -p 'test_*postgres*.py'
      - name: Static and workspace validation
        run: |
          make lint
          make validate
          make check-skills
          git diff --check

  web:
    name: web (${{ github.sha }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record immutable revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm --prefix web/admin ci
      - run: npm --prefix web/admin test
      - run: npm --prefix web/admin run build
