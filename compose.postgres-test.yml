services:
  authority-postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${NOVEL_FORGE_POSTGRES_TEST_DATABASE:?qualification database required}"
      POSTGRES_USER: novel_forge
      POSTGRES_PASSWORD: novel_forge
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        published: "0"
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_forge -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      novel-forge.qualification.run-id: "${NOVEL_FORGE_QUALIFICATION_RUN_ID:?qualification run id required}"

networks:
  default:
    labels:
      novel-forge.qualification.run-id: "${NOVEL_FORGE_QUALIFICATION_RUN_ID:?qualification run id required}"
